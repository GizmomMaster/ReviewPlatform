name: reviewplatform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reviewplatform}
      POSTGRES_USER: ${POSTGRES_USER:-reviewplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviewplatform}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Резервные копии: pg_dump раз в BACKUP_INTERVAL_HOURS в каталог BACKUP_DIR, хранятся BACKUP_KEEP_DAYS дней.
  # Восстановление: scripts/restore.sh backups/<файл>.dump
  backup:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-reviewplatform}
      PGUSER: ${POSTGRES_USER:-reviewplatform}
      PGPASSWORD: ${POSTGRES_PASSWORD:-reviewplatform}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB:-reviewplatform};Username=${POSTGRES_USER:-reviewplatform};Password=${POSTGRES_PASSWORD:-reviewplatform}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:8080}
    ports:
      - "${BACKEND_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  # Dev-сервер Vite с hot reload: docker compose --profile dev up frontend-dev
  frontend-dev:
    profiles: [dev]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
