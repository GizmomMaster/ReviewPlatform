name: reviewplatform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reviewplatform}
      POSTGRES_USER: ${POSTGRES_USER:-reviewplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviewplatform}
    ports:
      # Только локально: база не должна быть доступна из сети
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    # Только локально: в письмах ссылки на анкеты
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB:-reviewplatform};Username=${POSTGRES_USER:-reviewplatform};Password=${POSTGRES_PASSWORD:-reviewplatform}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:8080}
    # Только локально: снаружи API доступен через nginx фронтенда (/api)
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  # Dev-сервер Vite с hot reload: docker compose --profile dev up frontend-dev
  frontend-dev:
    profiles: [dev]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
