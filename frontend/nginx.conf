# Токен респондента в адресе (/survey/…, /api/surveys/…) — секрет: в журнал доступа он не попадает
map $request_uri $masked_uri {
    ~^(?<prefix>/(api/)?surveys?/)[^/?]+(?<rest>.*)$  "${prefix}***${rest}";
    default                                           $request_uri;
}

log_format masked '$remote_addr - [$time_local] "$request_method $masked_uri $server_protocol" '
                  '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log masked;
    server_tokens off;

    # Импорт матрицы — до 5 МБ
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        # index.html не кешируем: после выкладки браузер сразу получит новые ассеты
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
